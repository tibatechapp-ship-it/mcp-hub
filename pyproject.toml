[build-system]
requires = ["hatchling>=1.25,<2"]
build-backend = "hatchling.build"

[project]
name = "mcp-hub"
version = "1.9.0"
description = "Local-first MCP server catalog: sync, search, classify, export"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [
  { name = "tibatechapp-ship-it", email = "295264926+tibatechapp-ship-it@users.noreply.github.com" },
]
keywords = ["mcp", "model-context-protocol", "catalog", "sqlite", "local-first", "cli"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Database",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Topic :: System :: Software Distribution",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/tibatechapp-ship-it/mcp-hub"
Repository = "https://github.com/tibatechapp-ship-it/mcp-hub"
Issues = "https://github.com/tibatechapp-ship-it/mcp-hub/issues"
Changelog = "https://github.com/tibatechapp-ship-it/mcp-hub/blob/main/CHANGELOG.md"
Documentation = "https://tibatechapp-ship-it.github.io/mcp-hub/"
"PEP 503 Index" = "https://tibatechapp-ship-it.github.io/mcp-hub/simple/"

[project.optional-dependencies]
api = ["fastapi>=0.110,<1.0", "uvicorn>=0.27,<1.0"]
dev = [
  "pytest>=9.0.3,<10",
  "pytest-cov>=7.0,<8",
  "ruff>=0.5.0,<1.0",
  "mypy>=1.10,<3",
  "httpx>=0.27,<1.0",
  "pre-commit>=3.7,<5",
  "PyYAML>=6,<7",
]
docs = ["mkdocs>=1.6,<2"]
bench = ["aiohttp>=3.9,<4"]
mcp-server = ["mcp>=1.27,<3"]

[project.scripts]
mcp-hub = "mcp_hub.cli:main"
mcp-hub-server = "mcp_hub.mcp_server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_hub"]

[tool.hatch.build.targets.wheel.force-include]
"registry/mcp_servers.json" = "mcp_hub/registry/mcp_servers.json"
"profiles" = "mcp_hub/profiles"

[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/tests",
  "/action.yml",
  "/templates",
  "/registry",
  "/profiles",
  "/examples",
  "/README.md",
  "/LICENSE",
  "/CHANGELOG.md",
  "/CONTRIBUTING.md",
  "/SECURITY.md",
  "/SECURITY_AUDIT.md",
  "/docs",
  "/mkdocs.yml",
  "/pyproject.toml",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
  "slow: long-running tests (10K+ rows); skip with -m 'not slow'",
  "mcp: MCP server tests; requires mcp-server extra",
]

[tool.mypy]
python_version = "3.10"
strict = true
files = [
    "src/mcp_hub/auth.py",
    "src/mcp_hub/headers.py",
    "src/mcp_hub/ratelimit.py",
    "src/mcp_hub/payload_limit.py",
    "src/mcp_hub/safe_fetch.py",
    "src/mcp_hub/redact.py",
    "src/mcp_hub/live_sync.py",
    "src/mcp_hub/arabic_runtime.py",
    "src/mcp_hub/catalog_query.py",
    "src/mcp_hub/mcp_stateless.py",
    "src/mcp_hub/policy_gateway.py",
    "src/mcp_hub/semantic_router.py",
    "src/mcp_hub/description_smells.py",
    "src/mcp_hub/skills.py",
    "src/mcp_hub/tasks.py",
    "src/mcp_hub/persona.py",
    "src/mcp_hub/telemetry.py",
    "src/mcp_hub/apps.py",
    "src/mcp_hub/arflow.py",
    "src/mcp_hub/incremental.py",
    "src/mcp_hub/watch.py",
]
# Widen this list module by module; a repo-wide strict gate on day one would be
# noise, a gate on the security core is a promise that can be kept.

[tool.coverage.report]
fail_under = 88
show_missing = true
skip_covered = false
