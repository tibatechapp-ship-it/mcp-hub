[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "mcp-hub"
version = "1.1.0"
description = "Local-first MCP server catalog: sync, search, classify, export"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [{ name = "tibatechapp-ship-it" }]
keywords = ["mcp", "catalog", "local-first", "sqlite"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent",
]
dependencies = []

[project.optional-dependencies]
api = ["fastapi>=0.110", "uvicorn>=0.27"]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.5.0",
  "httpx>=0.27",
  "pre-commit>=3.7",
]
bench = ["aiohttp>=3.9"]

[project.scripts]
mcp-hub = "mcp_hub.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_hub"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
