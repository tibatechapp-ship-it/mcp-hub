[build-system]
requires = ["hatchling>=1.25,<2"]
build-backend = "hatchling.build"

[project]
name = "mcp-hub"
version = "1.3.1"
description = "Local-first MCP server catalog: sync, search, classify, export"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [
  { name = "tibatechapp-ship-it", email = "295264926+tibatechapp-ship-it@users.noreply.github.com" },
]
keywords = ["mcp", "model-context-protocol", "catalog", "sqlite", "local-first", "cli"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Database",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Topic :: System :: Software Distribution",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/tibatechapp-ship-it/mcp-hub"
Repository = "https://github.com/tibatechapp-ship-it/mcp-hub"
Issues = "https://github.com/tibatechapp-ship-it/mcp-hub/issues"
Changelog = "https://github.com/tibatechapp-ship-it/mcp-hub/blob/main/CHANGELOG.md"
Documentation = "https://github.com/tibatechapp-ship-it/mcp-hub#readme"

[project.optional-dependencies]
api = ["fastapi>=0.110,<1.0", "uvicorn>=0.27,<1.0"]
dev = [
  "pytest>=9.0.3,<10",
  "pytest-cov>=7.0,<8",
  "ruff>=0.5.0,<1.0",
  "httpx>=0.27,<1.0",
  "pre-commit>=3.7,<5",
]
bench = ["aiohttp>=3.9,<4"]
mcp-server = ["mcp>=1.27,<3"]

[project.scripts]
mcp-hub = "mcp_hub.cli:main"
mcp-hub-server = "mcp_hub.mcp_server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_hub"]

[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/tests",
  "/examples",
  "/README.md",
  "/LICENSE",
  "/CHANGELOG.md",
  "/CONTRIBUTING.md",
  "/SECURITY.md",
  "/pyproject.toml",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
  "slow: long-running tests (10K+ rows); skip with -m 'not slow'",
  "mcp: MCP server tests; requires mcp-server extra",
]
