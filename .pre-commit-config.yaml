# Run with: pre-commit install && pre-commit run --all-files
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.4
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
  - repo: local
    hooks:
      - id: mypy-security-core
        name: mypy --strict (security core)
        entry: mypy
        language: system
        pass_filenames: false
        types: [python]
