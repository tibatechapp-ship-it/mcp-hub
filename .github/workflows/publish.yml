name: publish

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install build tools
        run: python -m pip install --upgrade build twine

      - name: Build sdist + wheel
        run: python -m build

      - name: Check metadata
        run: python -m twine check dist/*

      - name: Verify wheel installs and runs
        run: |
          python -m venv /tmp/test-wheel
          /tmp/test-wheel/bin/pip install --quiet dist/*.whl
          /tmp/test-wheel/bin/mcp-hub --version
          /tmp/test-wheel/bin/mcp-hub --help > /dev/null
          /tmp/test-wheel/bin/python -c "import mcp_hub; print(mcp_hub.__version__)"

      - name: Verify wheel + API extra
        run: |
          python -m venv /tmp/test-api
          /tmp/test-api/bin/pip install --quiet "dist/$(ls dist | grep '\.whl$')[api]"
          /tmp/test-api/bin/python -c "from mcp_hub.api import create_app; print('api ok')"

      - name: Verify sdist installs
        run: |
          python -m venv /tmp/test-sdist
          /tmp/test-sdist/bin/pip install --quiet dist/*.tar.gz
          /tmp/test-sdist/bin/mcp-hub --version

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    # Only a real release may publish; workflow_dispatch is a build dry-run.
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/mcp-hub/
    permissions:
      contents: read
      id-token: write # OIDC trusted publishing — no API token secret needed
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
