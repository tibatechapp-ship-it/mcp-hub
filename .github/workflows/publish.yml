name: publish

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install build tools
        run: python -m pip install --upgrade build twine

      - name: Build sdist + wheel
        run: python -m build

      - name: Check metadata
        run: python -m twine check dist/*

      - name: Verify wheel installs and runs
        run: |
          python -m venv /tmp/test-wheel
          /tmp/test-wheel/bin/pip install --quiet dist/*.whl
          /tmp/test-wheel/bin/mcp-hub --version
          /tmp/test-wheel/bin/mcp-hub --help > /dev/null
          /tmp/test-wheel/bin/python -c "import mcp_hub; print(mcp_hub.__version__)"

      - name: Verify wheel + API extra
        run: |
          python -m venv /tmp/test-api
          /tmp/test-api/bin/pip install --quiet "dist/$(ls dist | grep '\.whl$')[api]"
          /tmp/test-api/bin/python -c "from mcp_hub.api import create_app; print('api ok')"

      - name: Verify sdist installs
        run: |
          python -m venv /tmp/test-sdist
          /tmp/test-sdist/bin/pip install --quiet dist/*.tar.gz
          /tmp/test-sdist/bin/mcp-hub --version

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    # Only a real release may publish; workflow_dispatch is a build dry-run.
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/mcp-hub/
    permissions:
      contents: read
      id-token: write # OIDC trusted publishing — no API token secret needed
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
