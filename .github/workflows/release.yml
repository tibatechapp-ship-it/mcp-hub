name: release
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev,api]"
      - run: pytest -q

  # Build the distributables once, here, so release.yml is the single owner of
  # the GitHub Release and its assets. publish.yml keeps its own build+verify
  # lane (its PyPI job is deferred); no cross-workflow race on release creation.
  build-dist:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install build tools
        run: python -m pip install --upgrade build twine
      - name: Build sdist + wheel
        run: python -m build
      - name: Check metadata
        run: python -m twine check dist/*
      - name: Generate SHA256SUMS for anti-rug-pull
        run: (cd dist && sha256sum *.whl *.tar.gz > SHA256SUMS)
      - name: Verify wheel installs and runs
        run: |
          python -m venv /tmp/test-wheel
          /tmp/test-wheel/bin/pip install --quiet dist/*.whl
          /tmp/test-wheel/bin/mcp-hub --version
          /tmp/test-wheel/bin/python -c "import mcp_hub; print(mcp_hub.__version__)"
      - name: Verify sdist installs
        run: |
          python -m venv /tmp/test-sdist
          /tmp/test-sdist/bin/pip install --quiet dist/*.tar.gz
          /tmp/test-sdist/bin/mcp-hub --version
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish-image:
    needs: [test, build-dist]
    runs-on: ubuntu-latest
    permissions:
      contents: write # upload release assets
      packages: write # push to ghcr.io
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Generate SBOM (SPDX JSON)
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ghcr.io/${{ github.repository }}:${{ steps.meta.outputs.version }}
          format: spdx-json
          output-file: sbom.spdx.json
          artifact-name: sbom.spdx.json

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/

      # One workflow owns release creation: attach wheel + sdist + SBOM together.
      - name: Attach packages and SBOM to the release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            dist/*.whl
            dist/*.tar.gz
            dist/SHA256SUMS
            sbom.spdx.json
          fail_on_unmatched_files: true
          # The release page is the first thing a user reads; let GitHub list
          # the merged PRs instead of shipping an empty body.
          generate_release_notes: true
