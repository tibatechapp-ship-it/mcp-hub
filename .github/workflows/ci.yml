name: ci
on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev,api]"
      - name: Ruff
        run: |
          ruff check src tests
          ruff format --check src tests
      - name: Tests
        run: pytest -m "not slow" --cov=mcp_hub --cov-report=term-missing

      - name: Provenance acceptance (v1.1.1)
        run: |
          pytest -q tests/test_provenance_dual.py --no-cov -v
          pytest -q tests/test_api.py -k provenance --no-cov -v

  mcp-server:
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        sdk: ["mcp>=1.27,<2", "mcp>=2,<3"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install with MCP server extra
        run: |
          pip install -e ".[dev,api,mcp-server]"
          pip install "${{ matrix.sdk }}"
      - name: Show MCP SDK version
        run: python -c "import importlib.metadata as m; print('mcp', m.version('mcp'))"
      - name: Run MCP server tests
        run: pytest -q tests/test_mcp_server.py -v --cov=mcp_hub.mcp_server --cov-report=term-missing

  security-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,api]"
          pip install pip-audit pip-licenses

      # Gates below cover the SHIPPED environment (project + runtime/dev deps).
      # The scanners themselves are installed afterwards so their own
      # transitive dependencies can never influence the audit or licence gates.

      - name: pip-audit (known CVEs in the resolved environment)
        run: pip-audit --desc --skip-editable

      - name: Licence check (no GPL / AGPL)
        run: |
          pip install pip-licenses
          pip-licenses --format=markdown --with-urls > LICENSES.md
          cat LICENSES.md
          if grep -iE '\b(AGPL|GPL)\b' LICENSES.md; then
            echo "::error::GPL/AGPL dependency detected — incompatible with Apache-2.0"
            exit 1
          fi

      - name: Install scanners
        run: pip install "bandit[toml]" semgrep

      - name: bandit (SAST — report medium+, block on HIGH)
        run: |
          bandit -r src/mcp_hub -ll -x tests -f json -o bandit.json || true
          bandit -r src/mcp_hub -lll -x tests

      - name: semgrep (Python security rules — block on ERROR)
        run: |
          semgrep --config "p/python" \
                  --config "p/security-audit" \
                  --severity ERROR \
                  --error \
                  --metrics=off \
                  src/mcp_hub

      - name: Upload security reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: security-reports
          path: |
            bandit.json
            LICENSES.md
          if-no-files-found: warn

  image-scan:
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Build image for scanning
        run: docker build -t mcp-hub:scan .

      - name: Debug — locate setuptools copies
        run: |
          docker run --rm mcp-hub:scan sh -c 'find / -xdev \( -name "setuptools*" -o -name "*setuptools*dist-info*" \) 2>/dev/null | head -20'

      - name: Trivy (CRITICAL + HIGH, blocking)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: mcp-hub:scan
          format: sarif
          output: trivy.sarif
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true

      - name: Upload SARIF to the Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: trivy.sarif
          category: trivy-image
