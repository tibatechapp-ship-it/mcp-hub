name: docs

# The CI `docs` job proves the site builds with --strict; this workflow is the
# one that publishes it. Pages must be set to "GitHub Actions" as its source.
on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "scripts/generate_simple_index.py"
      - "src/mcp_hub/pep503.py"
      - "tests/test_pep503.py"
      - "pyproject.toml"
      - ".github/workflows/docs.yml"
      - ".github/workflows/release.yml"
  # GITHUB_TOKEN-created releases do not trigger other workflows, so regenerate
  # the index when the release workflow finishes instead of on `release:`.
  workflow_run:
    workflows: ["release"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install mkdocs
        run: pip install "mkdocs>=1.6,<2"

      # --strict turns a broken nav entry or a dead relative link into a failure
      # instead of a published 404.
      - name: Build site
        run: mkdocs build --strict

      - name: Build PEP 503 simple index
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/generate_simple_index.py --repo "${{ github.repository }}" --output site/simple

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
