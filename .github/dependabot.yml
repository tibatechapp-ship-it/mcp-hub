version: 2

updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "03:00"
      timezone: UTC
    open-pull-requests-limit: 5
    # Patch and minor bumps arrive as one PR; a major still gets its own so it
    # can be reviewed (and reverted) on its own.
    groups:
      python-minor:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    labels: ["dependencies", "python"]
    commit-message:
      prefix: deps
      include: scope

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "03:15"
      timezone: UTC
    open-pull-requests-limit: 3
    groups:
      actions-minor:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    labels: ["dependencies", "ci"]
    commit-message:
      prefix: ci

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "03:30"
      timezone: UTC
    open-pull-requests-limit: 2
    groups:
      docker-minor:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      # python:3.15-slim is not a released image yet — the tag resolves to a
      # pre-release snapshot with no security patch stream behind it, which is
      # the wrong trade for a security tool. Drop this ignore when 3.15 GA
      # publishes an official slim image.
      - dependency-name: "python"
        versions: ["3.15.x", "3.15.*"]
    labels: ["dependencies", "docker"]
    commit-message:
      prefix: deps
      include: scope
