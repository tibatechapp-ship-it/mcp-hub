version: 2

updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "03:00"
      timezone: UTC
    open-pull-requests-limit: 5
    # Patch and minor bumps arrive as one PR; a major still gets its own so it
    # can be reviewed (and reverted) on its own.
    groups:
      python-minor:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    labels: ["dependencies", "python"]
    commit-message:
      prefix: deps
      include: scope

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "03:15"
      timezone: UTC
    open-pull-requests-limit: 3
    groups:
      actions-minor:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    labels: ["dependencies", "ci"]
    commit-message:
      prefix: ci

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "03:30"
      timezone: UTC
    open-pull-requests-limit: 2
    groups:
      docker-minor:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    labels: ["dependencies", "docker"]
    commit-message:
      prefix: deps
      include: scope
