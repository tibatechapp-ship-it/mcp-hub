name: Feature request
description: Propose a capability or a change in behaviour
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do that mcp-hub makes hard today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: CLI flag, endpoint, or behaviour. Sketches welcome.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Including "do nothing" — what breaks if this is not built?
  - type: dropdown
    id: scope
    attributes:
      label: Where does it belong?
      options:
        - Core (pure Python + SQLite, no new dependency)
        - API extra (FastAPI / uvicorn)
        - MCP server extra
        - Docs only
    validations:
      required: true
  - type: checkboxes
    id: contribute
    attributes:
      label: Would you send a PR?
      options:
        - label: Yes, I can implement this
        - label: Yes, with guidance
