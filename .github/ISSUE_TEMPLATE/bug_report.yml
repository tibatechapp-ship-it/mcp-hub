name: Bug report
description: Something behaves differently from what the docs say
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Please do **not** report security vulnerabilities here — see SECURITY.md.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: Actual behaviour, including the full error text.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Exact commands. A minimal `--db /tmp/x.sqlite3` repro is ideal.
      placeholder: |
        1. mcp-hub --db /tmp/x.sqlite3 import-text servers.txt
        2. mcp-hub --db /tmp/x.sqlite3 search postgres --fts
        3. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `mcp-hub --version`
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: doctor output
      description: Output of `mcp-hub --db <your db> doctor --json`
      render: json
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: OS, Python version, install method (pip / Docker / source)
    validations:
      required: true
