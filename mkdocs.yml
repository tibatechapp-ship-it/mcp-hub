site_name: mcp-hub
site_url: https://tibatechapp-ship-it.github.io/mcp-hub/
site_description: Local-first catalog for MCP servers
repo_url: https://github.com/tibatechapp-ship-it/mcp-hub
repo_name: tibatechapp-ship-it/mcp-hub
edit_uri: edit/main/docs/
docs_dir: docs
theme:
  name: mkdocs
  nav_style: dark
nav:
  - Overview: index.md
  - Install: install.md
  - CLI reference: cli.md
  - HTTP API: api.md
  - Stateless MCP endpoint: mcp_stateless.md
  - Policy, routing and description quality: phase2.md
  - Skills, tasks and persona: phase3.md
  - Telemetry and MCP Apps: phase4.md
  - Actionable approvals: phase5.md
  - Security model: security.md
  - Operations: operations.md
  - Arabic catalog: catalog_ar.md
  - Arabic task profiles: task_profiles_ar.md
markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
strict: true
